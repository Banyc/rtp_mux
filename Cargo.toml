[package]
name = "rtp_mux"
version = "0.1.0"
edition = "2024"

[dependencies]
# Command-line parsing for the `netem-tools` and `perf-history` binaries, the
# tooling's only public face. Optional behind `perf` because this crate is
# pinned by published tags and consumed as a dependency by `proxy`: a plain
# `[dependencies]` entry would make every consumer fetch and build a parser the
# library never calls.
clap = { version = "4.6.7", features = ["derive"], optional = true }
futures = "0.3"
metrics = "0.24"
mux = { git = "https://github.com/Banyc/mux.git", tag = "v0.0.37" }
# mux = { path = "../mux" }
# The layer-testing kit (`rtp_mux::testkit`, behind `testing`) consumes the
# generic helpers and the impairment instrument from the local harness
# checkout; the optional dependency is activated by the same feature so the
# kit compiles both in-crate (`cargo test --features testing`) and when
# rtp_mux is itself a dependency with `testing` enabled.
netem-test = { git = "https://github.com/Banyc/netem_test.git", tag = "v0.0.5", features = ["test-kit"], optional = true }
# netem-test = { path = "../netem_test/netem-test", features = ["test-kit"], optional = true }
rand = "0.10"
rtp = { git = "https://github.com/Banyc/rtp.git", tag = "v0.0.105" }
# rtp = { path = "../rtp" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"
tokio_udp = { git = "https://github.com/Banyc/tokio_udp.git", tag = "v0.0.6" }
# tokio_udp = { path = "../tokio_udp" }

[dev-dependencies]
# The rtp_mux layer kit (`rtp_mux::testkit`, behind `testing`) consumes the
# mux layer kit (`mux::testkit`, behind mux's `testing`) and the rtp layer
# kit (`rtp::testkit`, behind rtp's `testing`) from the sibling checkouts,
# plus the generic helpers/impairment instrument from the local harness
# checkout behind its `test-kit` feature. The dev-dependencies below make
# those kits compile in rtp_mux's default test invocation (`cargo test -p
# rtp_mux`); a plain `cargo build` of the library, and every consumer that
# does not request the feature itself, still compiles without `testing`, so
# rtp_mux's production dependency graph stays lean.
mux = { git = "https://github.com/Banyc/mux.git", tag = "v0.0.37", features = ["testing"] }
# mux = { path = "../mux", features = ["testing"] }
netem-test = { git = "https://github.com/Banyc/netem_test.git", tag = "v0.0.5", features = ["test-kit"] }
# netem-test = { path = "../netem_test/netem-test", features = ["test-kit"] }
rtp = { git = "https://github.com/Banyc/rtp.git", tag = "v0.0.105", features = ["testing"] }
# rtp = { path = "../rtp", features = ["testing"] }
rtp_mux = { path = ".", features = ["testing"] }
tokio = { version = "1", features = ["full", "test-util"] }

[features]
testing = ["dep:netem-test", "rtp/testing", "mux/testing"]
# The mandate tooling: the runner, the plotters and the gate checkers — the
# crate's own performance face. Both binaries require this feature
# (`required-features` below), so a plain library build — and every consumer —
# compiles without clap.
perf = ["dep:clap"]

# Both binaries parse their command line with clap, which is what the `perf`
# feature pulls in. Declared explicitly rather than auto-discovered, because a
# `[[bin]]` section is the only place `required-features` can be stated.
[[bin]]
name = "netem-tools"
path = "src/bin/netem-tools.rs"
required-features = ["perf"]

[[bin]]
name = "perf-history"
path = "src/bin/perf-history.rs"
required-features = ["perf"]

[lints.clippy]
disallowed_methods = "deny"
