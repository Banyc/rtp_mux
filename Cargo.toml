[package]
name = "rtp_mux"
version = "0.1.0"
edition = "2024"

[dependencies]
futures = "0.3"
metrics = "0.24"
mux = { git = "https://github.com/Banyc/mux.git", tag = "v0.0.23" }
rand = "0.10"
rtp = { git = "https://github.com/Banyc/rtp.git", tag = "v0.0.80" }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1"

