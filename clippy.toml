disallowed-methods = [
    { path = "tokio::spawn", reason = "every task must be owned by a caller-provided session scope (SessionSpawner) or an object-owned JoinSet so object drop aborts children and normal shutdown drains them; no session or writer task may be spawned detached" },
    { path = "tokio::task::spawn", reason = "every task must be owned by a caller-provided session scope (SessionSpawner) or an object-owned JoinSet so object drop aborts children and normal shutdown drains them; no session or writer task may be spawned detached" },
    { path = "tokio::runtime::Handle::spawn", reason = "every task must be owned by a caller-provided session scope (SessionSpawner) or an object-owned JoinSet so object drop aborts children and normal shutdown drains them; no session or writer task may be spawned detached" },
    { path = "tokio::sync::mpsc::unbounded_channel", reason = "no unbounded channels: they queue without bound under backpressure and can exhaust memory; use tokio::sync::mpsc::channel(N) so producers await a bounded slot" },
    { path = "mpsc::unbounded_channel", reason = "no unbounded channels: they queue without bound under backpressure and can exhaust memory; use mpsc::channel(N) so producers await a bounded slot" },
    { path = "tokio::sync::mpsc::unbounded_channel", reason = "use a named bounded mpsc capacity" },
    { path = "tokio::sync::mpsc::Sender::blocking_send", reason = "do not block runtime synchronization" },
]

disallowed-types = [
    { path = "tokio::sync::mpsc::UnboundedSender", reason = "use bounded mpsc::Sender" },
    { path = "tokio::sync::mpsc::UnboundedReceiver", reason = "use bounded mpsc::Receiver" },
    { path = "tokio::sync::Semaphore", reason = "use atomic/RAII admission plus watch or Notify" },
]
